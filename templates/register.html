{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Create User Account</h2>
    <form method="POST">
        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Contact Number</label>
        <input type="text" name="contact_info" placeholder="e.g. 0300-1234567">

        <label>Department <span class="muted">(optional)</span></label>
        <input type="text" name="department" placeholder="e.g. IT, Finance">

        <button class="btn btn-primary" type="submit">Register</button>
    </form>
    <p class="form-foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
