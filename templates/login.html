{% extends "base.html" %}
{% block title %}User Login{% endblock %}
{% block content %}
<div class="form-card">
    <h2>User Login</h2>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button class="btn btn-primary" type="submit">Login</button>
    </form>
    <p class="form-foot">No account? <a href="{{ url_for('register') }}">Register here</a></p>
    <p class="form-foot muted">Demo user: alice@example.com / password123</p>
</div>
{% endblock %}
